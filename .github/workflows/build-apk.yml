name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao gradlew
        working-directory: app
        run: chmod +x ./gradlew

      - name: Compilar APK (release não assinado)
        working-directory: app
        run: ./gradlew assembleRelease --stacktrace

      - name: Compilar APK (debug, backup caso release falhe)
        if: failure()
        working-directory: app
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: xodos-winlator-apk
          path: |
            app/**/outputs/**/*.apk
          if-no-files-found: warn
